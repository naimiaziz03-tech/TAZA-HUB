name: Build Taza Hub Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html apps.js sw.js manifest.webmanifest www/
          cp icon-192.png icon-512.png icon-maskable-512.png www/
          cp -R apps www/apps

      - name: Create Capacitor package configuration
        run: |
          cat > package.json <<'EOF'
          {
            "name": "taza-hub",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.4",
              "@capacitor/android": "^7.4.4",
              "@capacitor/filesystem": "^7.1.4",
              "@capacitor/share": "^7.0.2"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.4"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.tazahub.app",
            "appName": "Taza Hub",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android plugins
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Taza-Hub-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
