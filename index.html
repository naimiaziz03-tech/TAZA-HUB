<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تطبيقاتي</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14171b" id="tc">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تطبيقاتي">
<style>
:root{--bg:#f2f4f7;--card:#fff;--tx:#14181f;--mu:#667085;--bd:#dde2ea;--sh:0 1px 3px rgba(16,24,40,.08);--ac:#1d5fd0;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#10141a;--card:#1b2129;--tx:#e8ecf2;--mu:#9aa5b4;--bd:#2c343f;--sh:none;--ac:#6ea0ff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);overflow:hidden}
button{font:inherit;color:inherit}

/* الصفحة الرئيسية */
#home{flex:1;overflow:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch}
.hd{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 14px}
.hd h1{margin:0;font-size:24px}
.hd p{margin:4px 0 0;color:var(--mu);font-size:14px}
#mbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-size:20px;line-height:1;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:start;padding:16px 14px 14px;border:1px solid var(--bd);border-top:4px solid var(--c,#1d5fd0);border-radius:16px;background:var(--card);box-shadow:var(--sh);cursor:pointer;min-height:150px}
.card:active{transform:scale(.98)}
.card img{width:52px;height:52px;border-radius:12px;object-fit:cover;background:#fff}
.card b{font-size:17px;line-height:1.3}
.card span{font-size:13px;color:var(--mu);line-height:1.4}
.bk{margin-top:16px;padding:14px;border:1px solid var(--bd);border-radius:16px;background:var(--card);box-shadow:var(--sh)}
.bk h2{margin:0 0 6px;font-size:16px}
.bk p{margin:0 0 12px;color:var(--mu);font-size:13px;line-height:1.5}
.bkrow{display:flex;gap:10px}
.bkrow button{flex:1;padding:12px 8px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);font-size:14px;font-weight:600;cursor:pointer}
.bkrow button:first-child{background:var(--ac);border-color:var(--ac);color:#fff}
.bkrow button:active{opacity:.85}
.bkrow button:disabled{opacity:.6}
.ver{margin-top:22px;text-align:center;font-size:12px;color:var(--mu)}

/* القائمة */
#menu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 60px);inset-inline-start:16px;z-index:30;min-width:210px;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.25);padding:6px;display:none}
#menu.on{display:block}
#menu button{display:block;width:100%;text-align:start;padding:12px;border:0;background:none;border-radius:10px;font-size:15px;cursor:pointer}
#menu button:active{background:var(--bg)}
#menu .note{padding:8px 12px;font-size:12px;color:var(--mu)}
#scrim{position:fixed;inset:0;z-index:20;display:none}
#scrim.on{display:block}

/* عرض التطبيقات */
#frames{flex:1;position:relative;display:none;min-height:0}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#frames iframe[hidden]{display:none}
#nav{display:none;flex:none;border-top:1px solid var(--bd);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:auto}
#nav button{flex:1 0 64px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px 6px;border:0;border-top:3px solid transparent;background:none;font-size:11px;color:var(--mu);cursor:pointer;min-width:64px}
#nav button img{width:26px;height:26px;border-radius:7px;object-fit:cover;background:#fff}
#nav button .hi{font-size:22px;line-height:26px;height:26px}
#nav button.on{color:var(--tx);font-weight:700;border-top-color:var(--c,var(--ac))}
body.app #home{display:none}
body.app #frames{display:block}
body.app #nav{display:flex}

/* شريط التحديث */
#upd{position:fixed;inset-inline:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:40;display:none;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:#1d5fd0;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:14px}
#upd.on{display:flex}
#upd button{border:0;border-radius:10px;padding:8px 14px;background:#fff;color:#1d5fd0;font-weight:700;cursor:pointer}
#toast{position:fixed;inset-inline:0;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);z-index:50;display:none;justify-content:center;pointer-events:none}
#toast span{background:rgba(20,24,31,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:86%;text-align:center}
#toast.on{display:flex}
</style>
<script src="apps.js"></script>
</head>
<body>

<section id="home">
  <div class="hd">
    <div><h1>تطبيقاتي</h1><p>اختر القسم</p></div>
    <button id="mbtn" aria-label="القائمة">⋮</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="bk">
    <h2>النسخ الاحتياطي الشامل</h2>
    <p>ملف واحد يضم بيانات كل الأقسام مع الملفات المرجعية والصور، لاسترجاعها في هذا الهاتف أو في هاتف جديد.</p>
    <div class="bkrow"><button id="b-save">💾 تنزيل نسخة شاملة</button><button id="b-rest">📥 استرجاع نسخة</button></div>
    <input type="file" id="b-file" accept=".json,application/json" hidden>
  </div>
  <div class="ver" id="ver"></div>
</section>

<div id="frames"></div>
<nav id="nav"></nav>

<div id="scrim"></div>
<div id="menu" role="menu">
  <button id="m-inst" hidden>📲 تثبيت التطبيق</button>
  <button id="m-upd">🔄 تحديث التطبيق</button>
  <div class="note" id="m-note"></div>
</div>
<div id="upd"><span>يتوفر إصدار جديد من التطبيق</span><button id="upd-go">تحديث</button></div>
<div id="toast"><span id="toast-t"></span></div>

<script>
(function(){
"use strict";
var HUB_VER="1.1";
var $=function(s){return document.querySelector(s)};
var apps=(window.APPS||[]);
var frames={},cur=null;

/* ---------- البطاقات وشريط التنقل ---------- */
var grid=$("#grid"),nav=$("#nav");
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

var hb=el("button","",'<span class="hi">⌂</span><span>الرئيسية</span>');
hb.onclick=function(){show(null)};
nav.appendChild(hb);

apps.forEach(function(a){
  var c=el("button","card",'<img alt="" src="'+esc(a.icon)+'"><b>'+esc(a.title)+'</b><span>'+esc(a.sub||"")+'</span>');
  c.style.setProperty("--c",a.color||"#1d5fd0");
  c.onclick=function(){show(a.id)};
  grid.appendChild(c);
  var n=el("button","",'<img alt="" src="'+esc(a.icon)+'"><span>'+esc(a.short||a.title)+'</span>');
  n.style.setProperty("--c",a.color||"#1d5fd0");
  n.dataset.id=a.id;
  n.onclick=function(){show(a.id)};
  nav.appendChild(n);
});

function show(id){
  cur=id;
  document.body.classList.toggle("app",!!id);
  Array.prototype.forEach.call(nav.children,function(b){b.classList.toggle("on",!!id&&b.dataset.id===id)});
  var a=apps.filter(function(x){return x.id===id})[0];
  $("#tc").setAttribute("content",a?(a.color||"#14171b"):"#14171b");
  Object.keys(frames).forEach(function(k){frames[k].hidden=(k!==id)});
  if(a&&!frames[id]){
    var f=document.createElement("iframe");
    f.src=a.path;
    f.title=a.title;
    f.setAttribute("allow","fullscreen; clipboard-read; clipboard-write");
    $("#frames").appendChild(f);
    frames[id]=f;
  }
  if(a)document.title=a.title;else document.title="تطبيقاتي";
  closeMenu();
}

/* ---------- القائمة ---------- */
function closeMenu(){$("#menu").classList.remove("on");$("#scrim").classList.remove("on")}
$("#mbtn").onclick=function(){$("#menu").classList.add("on");$("#scrim").classList.add("on")};
$("#scrim").onclick=closeMenu;
$("#ver").textContent="الإصدار "+HUB_VER;
$("#m-note").textContent="الإصدار "+HUB_VER+" · بياناتك تبقى في هذا الهاتف";

function toast(t){$("#toast-t").textContent=t;$("#toast").classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){$("#toast").classList.remove("on")},2600)}

/* ---------- التثبيت ---------- */
var DP=null,SA=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone;
var IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
function instVis(){$("#m-inst").hidden=!(!SA&&(DP||IOS))}
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();DP=e;instVis()});
window.addEventListener("appinstalled",function(){DP=null;SA=true;instVis();toast("تم التثبيت ✓")});
$("#m-inst").onclick=function(){
  closeMenu();
  if(DP){DP.prompt();DP=null;instVis()}
  else toast("آيفون: زر المشاركة ثم «إضافة إلى الشاشة الرئيسية»");
};
instVis();

/* ---------- التحديث ---------- */
var reg=null,applying=false;
function showUpd(w){
  $("#upd").classList.add("on");
  $("#upd-go").onclick=function(){applying=true;try{w.postMessage("skipWaiting")}catch(e){location.reload()}};
}
async function hardUpdate(){
  try{
    var r=await navigator.serviceWorker.getRegistration();
    if(r)await r.unregister();
    var ks=await caches.keys();
    await Promise.all(ks.filter(function(k){return k.indexOf("tazahub-")===0}).map(function(k){return caches.delete(k)}));
  }catch(e){}
  location.replace(location.pathname+"?u="+Date.now());
}
$("#m-upd").onclick=function(){closeMenu();toast("جارٍ التحديث…");hardUpdate()};
window.addEventListener("message",function(e){
  if(e.origin!==location.origin)return;
  if(e.data&&e.data.hostCmd==="update")hardUpdate();
});

if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){
  navigator.serviceWorker.addEventListener("controllerchange",function(){if(applying)location.reload()});
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(r){
    reg=r;
    if(r.waiting&&navigator.serviceWorker.controller)showUpd(r.waiting);
    r.addEventListener("updatefound",function(){
      var w=r.installing;
      if(w)w.addEventListener("statechange",function(){if(w.state==="installed"&&navigator.serviceWorker.controller)showUpd(w)});
    });
    document.addEventListener("visibilitychange",function(){if(!document.hidden)r.update().catch(function(){})});
  }).catch(function(){});
}

/* ---------- نسخة احتياطية شاملة ---------- */
function B64(blob){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var s=String(r.result);res(s.slice(s.indexOf(",")+1))};r.onerror=function(){rej(r.error)};r.readAsDataURL(blob)})}
function unb64(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function enc(v){
  if(v===null||v===undefined)return null;
  if(typeof v!=="object")return v;
  if(v instanceof Blob){var o={__t:(typeof File!=="undefined"&&v instanceof File)?"file":"blob",type:v.type,b64:await B64(v)};if(o.__t==="file"){o.name=v.name;o.lm=v.lastModified}return o}
  if(v instanceof ArrayBuffer)return{__t:"ab",b64:await B64(new Blob([v]))};
  if(ArrayBuffer.isView(v))return{__t:"ta",c:v.constructor.name,b64:await B64(new Blob([v.buffer.slice(v.byteOffset,v.byteOffset+v.byteLength)]))};
  if(v instanceof Date)return{__t:"date",v:v.getTime()};
  if(Array.isArray(v)){var a=[];for(var i=0;i<v.length;i++)a.push(await enc(v[i]));return a}
  var out={};for(var k in v)if(Object.prototype.hasOwnProperty.call(v,k))out[k]=await enc(v[k]);return out;
}
function dec(v){
  if(v===null||typeof v!=="object")return v;
  if(Array.isArray(v))return v.map(dec);
  switch(v.__t){
    case"blob":return new Blob([unb64(v.b64)],{type:v.type||""});
    case"file":return new File([unb64(v.b64)],v.name||"file",{type:v.type||"",lastModified:v.lm||Date.now()});
    case"ab":return unb64(v.b64).buffer;
    case"ta":{var u=unb64(v.b64),C=window[v.c]||Uint8Array;return new C(u.buffer,0,Math.floor(u.byteLength/(C.BYTES_PER_ELEMENT||1)))}
    case"date":return new Date(v.v);
  }
  var o={};Object.keys(v).forEach(function(k){o[k]=dec(v[k])});return o;
}
function lsMatch(p,k){return p.charAt(p.length-1)==="*"?k.indexOf(p.slice(0,-1))===0:k===p}
function lsKeys(a){
  var out=[],pats=(a.storage&&a.storage.ls)||[];
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(pats.some(function(p){return lsMatch(p,k)}))out.push(k)}
  return out;
}
/* نفتح قاعدة موجودة فقط، حتى لا ننشئ قاعدة فارغة تفسد التطبيق */
function openExisting(name){return new Promise(function(res){
  var r=indexedDB.open(name);
  r.onupgradeneeded=function(){try{r.transaction.abort()}catch(e){}};
  r.onsuccess=function(){res(r.result)};
  r.onerror=function(){res(null)};
  r.onblocked=function(){res(null)};
})}
function createDb(cfg){return new Promise(function(res,rej){
  var r=indexedDB.open(cfg.db,cfg.version||1);
  r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains(cfg.store)){var o={};if(cfg.keyPath)o.keyPath=cfg.keyPath;if(cfg.autoInc)o.autoIncrement=true;d.createObjectStore(cfg.store,o)}};
  r.onsuccess=function(){res(r.result)};
  r.onerror=function(){rej(r.error)};
  r.onblocked=function(){rej(new Error("blocked"))};
})}
async function readStore(cfg){
  var db=await openExisting(cfg.db);
  if(!db)return[];
  if(!db.objectStoreNames.contains(cfg.store)){db.close();return[]}
  var rows=await new Promise(function(res,rej){
    var out=[],rq=db.transaction(cfg.store,"readonly").objectStore(cfg.store).openCursor();
    rq.onsuccess=function(){var c=rq.result;if(c){out.push({k:c.primaryKey,v:c.value});c.continue()}else res(out)};
    rq.onerror=function(){rej(rq.error)};
  });
  db.close();
  var done=[];
  for(var i=0;i<rows.length;i++)done.push({k:rows[i].k,v:await enc(rows[i].v)});
  return done;
}
async function writeStore(cfg,rows){
  var db=await openExisting(cfg.db);
  if(!db)db=await createDb(cfg);
  if(!db.objectStoreNames.contains(cfg.store)){db.close();throw new Error("store missing: "+cfg.store)}
  await new Promise(function(res,rej){
    var tx=db.transaction(cfg.store,"readwrite"),os=tx.objectStore(cfg.store);
    os.clear();
    rows.forEach(function(r){if(cfg.keyPath)os.put(dec(r.v));else os.put(dec(r.v),r.k)});
    tx.oncomplete=function(){res()};
    tx.onerror=function(){rej(tx.error)};
    tx.onabort=function(){rej(tx.error||new Error("aborted"))};
  });
  db.close();
}
function two(n){return(n<10?"0":"")+n}
function stamp(){var d=new Date();return d.getFullYear()+"-"+two(d.getMonth()+1)+"-"+two(d.getDate())+"_"+two(d.getHours())+two(d.getMinutes())}
function saveFile(blob,name){
  var f=new File([blob],name,{type:blob.type});
  if(IOS&&navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share({files:[f]});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},5000);
  return Promise.resolve();
}
async function doBackup(){
  var b=$("#b-save");b.disabled=true;toast("جارٍ تجهيز النسخة…");
  try{
    var bk={app:"taza-hub",v:1,date:new Date().toISOString(),apps:[],ls:{},idb:[]};
    for(var i=0;i<apps.length;i++){
      var a=apps[i],s=a.storage||{};
      if(!(s.ls&&s.ls.length)&&!(s.idb&&s.idb.length))continue;
      bk.apps.push(a.id);
      lsKeys(a).forEach(function(k){bk.ls[k]=localStorage.getItem(k)});
      var dbs=s.idb||[];
      for(var j=0;j<dbs.length;j++)bk.idb.push({app:a.id,db:dbs[j].db,store:dbs[j].store,rows:await readStore(dbs[j])});
    }
    var blob=new Blob([JSON.stringify(bk)],{type:"application/json"});
    var mb=(blob.size/1048576);
    await saveFile(blob,"TAZA_backup_"+stamp()+".json");
    toast("تم تنزيل النسخة ✓ ("+(mb<0.1?"أقل من 0.1":mb.toFixed(1))+" MB)");
  }catch(e){
    if(!(e&&e.name==="AbortError"))toast("تعذر إنشاء النسخة");
  }
  b.disabled=false;
}
async function doRestore(file){
  var bk;
  try{bk=JSON.parse(await file.text())}catch(e){toast("الملف غير صالح");return}
  if(!bk||bk.app!=="taza-hub"||!Array.isArray(bk.apps)){toast("هذا ليس ملف نسخة احتياطية من التطبيق");return}
  var names=apps.filter(function(a){return bk.apps.indexOf(a.id)>-1}).map(function(a){return a.title});
  if(!names.length){toast("النسخة لا تحتوي أقسامًا معروفة");return}
  if(!confirm("سيتم استبدال بيانات الأقسام التالية ببيانات النسخة:\n"+names.join("، ")+"\n\nمتابعة؟"))return;
  toast("جارٍ الاسترجاع…");
  try{
    apps.forEach(function(a){
      if(bk.apps.indexOf(a.id)<0)return;
      lsKeys(a).forEach(function(k){localStorage.removeItem(k)});
    });
    Object.keys(bk.ls||{}).forEach(function(k){
      var ok=apps.some(function(a){return bk.apps.indexOf(a.id)>-1&&((a.storage&&a.storage.ls)||[]).some(function(p){return lsMatch(p,k)})});
      if(ok)localStorage.setItem(k,bk.ls[k]);
    });
    for(var i=0;i<apps.length;i++){
      var a=apps[i];
      if(bk.apps.indexOf(a.id)<0)continue;
      var dbs=(a.storage&&a.storage.idb)||[];
      for(var j=0;j<dbs.length;j++){
        var e=(bk.idb||[]).filter(function(x){return x.app===a.id&&x.db===dbs[j].db&&x.store===dbs[j].store})[0];
        await writeStore(dbs[j],e?e.rows:[]);
      }
    }
    toast("تم الاسترجاع ✓");
    setTimeout(function(){location.replace(location.pathname)},1200);
  }catch(e){toast("تعذر الاسترجاع كاملًا")}
}
$("#b-save").onclick=doBackup;
$("#b-rest").onclick=function(){$("#b-file").value="";$("#b-file").click()};
$("#b-file").onchange=function(){if(this.files&&this.files[0])doRestore(this.files[0])};

/* ---------- فتح قسم مباشرة (اختصارات الشاشة الرئيسية) ---------- */
var q=new URLSearchParams(location.search).get("app");
if(q&&apps.some(function(a){return a.id===q}))show(q);
})();
</script>
</body>
</html>
