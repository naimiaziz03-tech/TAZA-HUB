<script>/* تنزيل استمارة الحجز (Annexe n°1) بصيغة Word .docx — بدون أي مكتبة خارجية */
(function () {
  "use strict";
  var te = new TextEncoder();
  var xe = function (s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  };

  /* ---------- عناصر Word ---------- */
  function run(t, b) {
    return '<w:r>' + (b ? '<w:rPr><w:b/></w:rPr>' : '') + '<w:t xml:space="preserve">' + xe(t) + '</w:t></w:r>';
  }
  // parts: نص عادي | {b:"نص غامق"} | {br:1}
  function para(parts, jc, bold, sz) {
    var pr = jc ? '<w:pPr><w:jc w:val="' + jc + '"/></w:pPr>' : '';
    var out = "";
    (parts || []).forEach(function (x) {
      if (typeof x === "string") out += sz ? '<w:r><w:rPr>' + (bold ? '<w:b/>' : '') + '<w:sz w:val="' + sz + '"/></w:rPr><w:t xml:space="preserve">' + xe(x) + '</w:t></w:r>' : run(x, bold);
      else if (x.br) out += '<w:r><w:br/></w:r>';
      else if (x.b != null) out += run(x.b, true);
    });
    return '<w:p>' + pr + out + '</w:p>';
  }
  function cell(w, inner, head) {
    return '<w:tc><w:tcPr><w:tcW w:w="' + w + '" w:type="dxa"/>' +
      (head ? '<w:shd w:val="clear" w:color="auto" w:fill="E7E6E6"/>' : '') +
      '</w:tcPr>' + inner + '</w:tc>';
  }
  function table(widths, rows) {
    var bd = ["top", "left", "bottom", "right", "insideH", "insideV"].map(function (k) {
      return '<w:' + k + ' w:val="single" w:sz="4" w:space="0" w:color="000000"/>';
    }).join("");
    var total = widths.reduce(function (a, b) { return a + b; }, 0);
    var x = '<w:tbl><w:tblPr><w:tblW w:w="' + total + '" w:type="dxa"/><w:tblBorders>' + bd + '</w:tblBorders>' +
      '<w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>' +
      widths.map(function (w) { return '<w:gridCol w:w="' + w + '"/>'; }).join("") + '</w:tblGrid>';
    rows.forEach(function (r) {
      x += '<w:tr>' + r.cells.map(function (c, i) { return cell(widths[i], c, r.head); }).join("") + '</w:tr>';
    });
    return x + '</w:tbl>';
  }
  function headRow(labels) {
    return { head: true, cells: labels.map(function (l) { return para([{ b: l }], "center"); }) };
  }

  /* ---------- محتوى الاستمارة (نفس ترتيب المعاينة) ---------- */
  function bodyXml() {

      "Mlle, Mme, M. : ", { b: g("nom") }, { br: 1 },

    x += para(["Matériel/Produit transporté : ", { b: g("mat") }]);

    x += para([{ b: "Rubrique réservée au gestionnaire du parc automobile :" }]);

      "Véhicule attribué : N° ONEE/BE ", { b: g("onee") }, "     N° d’immatriculation : ", { b: g("immat") }, "     Type : ", { b: g("type") }, { br: 1 },
      "Lieu et itinéraire du déplacement : ", { b: g("iti") }
    ]);

      para(["Date de départ : " + g("dd"), { br: 1 }, "Index : " + g("i1")]),

    ] }]);
    x += para([""]);
    return x;
  }

  function documentXml() {
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>' + bodyXml() +
      '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="900" w:right="1000" w:bottom="900" w:left="1000" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr>' +
      '</w:body></w:document>';

  var STYLES = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr>' +
    '<w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial" w:eastAsia="Arial"/><w:sz w:val="21"/><w:szCs w:val="21"/><w:lang w:val="fr-FR" w:bidi="ar-MA"/></w:rPr></w:rPrDefault>' +
    '<w:pPrDefault><w:pPr><w:spacing w:after="80" w:line="252" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>' +
    '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style></w:styles>';
  var CT = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
    '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>';
  var RELS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  var DOCRELS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';

  /* ---------- ضغط ZIP بسيط (بدون ضغط) ---------- */
  var CRC = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();
  function crc32(u) { var c = 0xFFFFFFFF; for (var i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function zip(files) {
    var parts = [], cen = [], off = 0;
    files.forEach(function (f) {
      var nb = te.encode(f[0]), d = te.encode(f[1]), c = crc32(d);
      var lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
      lh.setUint16(8, 0, true); lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true);
      lh.setUint32(14, c, true); lh.setUint32(18, d.length, true); lh.setUint32(22, d.length, true);
      lh.setUint16(26, nb.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), nb, d);
      var ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 0, true); ch.setUint16(12, 0, true); ch.setUint16(14, 0x21, true);
      ch.setUint32(16, c, true); ch.setUint32(20, d.length, true); ch.setUint32(24, d.length, true);
      ch.setUint16(28, nb.length, true); ch.setUint32(42, off, true);
      cen.push(new Uint8Array(ch.buffer), nb);
      off += 30 + nb.length + d.length;
    });
    var cl = 0; cen.forEach(function (x) { cl += x.length; });
    var e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
    e.setUint32(12, cl, true); e.setUint32(16, off, true);

  }

  function makeDocx() {
    return zip([
      ["[Content_Types].xml", CT],
      ["_rels/.rels", RELS],
      ["word/document.xml", documentXml()],
      ["word/_rels/document.xml.rels", DOCRELS],
      ["word/styles.xml", STYLES]
    ]);
  }
  function fileName() {
    var d = ((typeof V === "function" ? V("dd") : "") || "").replace(/\//g, "-");

/* Taza Hub: Android-safe file export. A file is written using the native Filesystem plugin and then offered through Android's share/save sheet. */
window.tazaSaveBlob = async function(blob, filename) {
  const cap = window.Capacitor;
  const plugins = cap && cap.Plugins;
  const fs = plugins && plugins.Filesystem;
  const share = plugins && plugins.Share;
  const native = !!(cap && typeof cap.isNativePlatform === 'function' && cap.isNativePlatform());
  if (native) {
    if (!fs || typeof fs.writeFile !== 'function') throw new Error('إضافة حفظ الملفات غير موجودة في نسخة التطبيق. أعد بناء APK بالنسخة المحدّثة.');
    if (!share || typeof share.share !== 'function') throw new Error('إضافة مشاركة الملفات غير موجودة في نسخة التطبيق. أعد بناء APK بالنسخة المحدّثة.');
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => { const value = String(reader.result || ''); const comma = value.indexOf(','); if (comma < 0) reject(new Error('تعذّر تجهيز الملف')); else resolve(value.slice(comma + 1)); };
      reader.onerror = () => reject(new Error('تعذّر تجهيز الملف للحفظ'));
      reader.readAsDataURL(blob);
    });
    const result = await fs.writeFile({ path: filename, data: base64, directory: 'DOCUMENTS', recursive: true });
    if (!result || !result.uri) throw new Error('لم يؤكد نظام Android حفظ الملف');
    await share.share({ title: filename, text: 'اختَر حفظ الملف في الجهاز أو تطبيق الملفات', url: result.uri, dialogTitle: 'حفظ الملف في الهاتف' });
    return { saved: true, native: true, uri: result.uri };
  }
  /* Standard browser/PWA fallback. */
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 15000);
  return { saved: true, native: false };
};
/* Route all generated blob/data downloads through the native saver inside the installed Android app. */
(function () {
  if (window.__tazaDownloadHookInstalled) return;
  window.__tazaDownloadHookInstalled = true;
  document.addEventListener('click', function (ev) {
    const a = ev.target && ev.target.closest ? ev.target.closest('a[download]') : null;
    if (!a) return;
    const cap = window.Capacitor;
    if (!(cap && typeof cap.isNativePlatform === 'function' && cap.isNativePlatform())) return;
    const href = a.href || '';
    if (!(href.startsWith('blob:') || href.startsWith('data:'))) return;
    ev.preventDefault(); ev.stopImmediatePropagation();
    if (a.__tazaSaving) return;
    a.__tazaSaving = true;
    fetch(href).then(r => { if (!r.ok) throw new Error('تعذّر قراءة الملف المُنشأ'); return r.blob(); })
      .then(blob => window.tazaSaveBlob(blob, a.download || 'TazaHub-file'))
      .catch(err => alert('فشل حفظ الملف: ' + (err && err.message ? err.message : 'خطأ غير معروف')))
      .finally(() => { a.__tazaSaving = false; });
  }, true);
})();
