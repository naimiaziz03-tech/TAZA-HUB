<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#6a727c;--ac:#1f6feb;--bd:#dde1e6;--ok:#1a7f37}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1e2328;--tx:#e8ebee;--mu:#9aa3ad;--ac:#5b9dff;--bd:#2f363d;--ok:#3fb950}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1e2328;--tx:#e8ebee;--mu:#9aa3ad;--ac:#5b9dff;--bd:#2f363d;--ok:#3fb950}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:16px}
header{padding:14px 16px;background:var(--ac);color:#fff;font-weight:700}
header small{display:block;font-weight:400;opacity:.9}
main{padding:12px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 8px;color:var(--ac)}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 2px}
input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
button{border:0;border-radius:8px;padding:10px 14px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
button.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.sm{padding:6px 10px;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:12px 4px}
nav button.on{color:var(--ac);font-weight:700}
.tab{display:none}.tab.on{display:block}
.p{display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--bd);padding:6px 0}
.p span{flex:1}.g{margin:10px 0 4px;font-weight:700}
.ck{display:flex;gap:6px;align-items:center;margin:4px 0}.ck>span{flex:0 0 42%;font-size:14px}
.f{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--bd);padding:8px 0;direction:ltr}
.f a{flex:1;overflow-wrap:anywhere;color:var(--ac);cursor:pointer}.f small{color:var(--mu)}
.mu{color:var(--mu);font-size:13px}.ch{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}[hidden]{display:none!important}#pv{position:fixed;inset:0;background:var(--bg);z-index:9;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}.pr{display:flex;gap:8px;border-bottom:1px solid var(--bd);padding:6px 0;direction:ltr;font-size:14px}.pr b{flex:0 0 38%}.paper{background:#fff;color:#000;padding:12px;font:13px/1.45 Georgia,serif;border-radius:6px;direction:ltr}.paper table{width:100%;border-collapse:collapse;margin:6px 0}.paper th,.paper td{border:1px solid #000;padding:4px 6px;text-align:center;vertical-align:top;font-size:12px}.paper h3{text-align:center;margin:8px 0}.paper p{margin:6px 0}#mb{background:none;font-size:22px;padding:2px 8px;line-height:1}.p input[type=checkbox]{width:22px;height:22px;flex:none}

<script>
const $=s=>document.querySelector(s);
let S={persons:[{p:"MOUAD",n:"MOGHLI",m:"83677"},{p:"AZIZ",n:"NAIMI",m:"83684"},{p:"Jaouad",n:"Jaghmoum",m:"82021"},{p:"Rachid",n:"Elyaagoubi",m:"76318"}],perim:"",ck:{"Porte arrière gauche":"RAS"}};
try{const r=localStorage.getItem("resv");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem("resv",JSON.stringify(S))}catch(e){}}
document.querySelectorAll("[data-k]").forEach(el=>{
 if(el.tagName==="BUTTON"){el.onclick=()=>{S.perim=el.dataset.v;save();per()};return}
 if(S[el.dataset.k]!==undefined)el.value=S[el.dataset.k];
 el.oninput=()=>{S[el.dataset.k]=el.value;save()};
});
function per(){[["po","Oui"],["pn","Non"]].forEach(([i,v])=>{const b=$("#"+i);b.style.background=S.perim===v?"var(--ac)":"";b.style.color=S.perim===v?"#fff":""})}per();
function pl(){S.persons.sort((a,b)=>(parseInt(String(a.m).replace(/\D/g,""))||9e9)-(parseInt(String(b.m).replace(/\D/g,""))||9e9));$("#pl").innerHTML=S.persons.map((x,i)=>`<div class="p" style="opacity:${x.a===false?.45:1}"><input type="checkbox" ${x.a===false?"":"checked"} onchange="tgl(${i},this.checked)" aria-label="تنشيط"><span dir="ltr">${esc(x.p)} ${esc(x.n)} · ${esc(x.m)}</span><button class="sec sm" onclick="delP(${i})">✕</button></div>`).join("")||'<p class="mu">لا أحد</p>'}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function addP(){const p=$("#pp").value.trim(),n=$("#pnm").value.trim(),m=$("#pm").value.trim();if(!p&&!n)return;S.persons.push({p,n,m});S.dir=S.dir||[];if(!dir().some(x=>x.m===m&&x.n===n))S.dir.push({p,n,m});save();pl();np(0)}
const DIR0=[{p:"MOUAD",n:"MOGHLI",m:"83677"},{p:"AZIZ",n:"NAIMI",m:"83684"},{p:"Jaouad",n:"Jaghmoum",m:"82021"},{p:"Rachid",n:"Elyaagoubi",m:"76318"},{p:"OMAR",n:"HAKKI",m:"82697 Q"}];
function dir(){const a=[...DIR0,...(S.dir||[])];return a.filter((x,i)=>a.findIndex(y=>y.m===x.m&&y.n===x.n)===i)}
const nz=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function np(o){$("#np").hidden=!o;$("#addb").hidden=!!o;$("#pd").hidden=true;$("#sg").innerHTML="";$("#pnm").value=$("#pp").value=$("#pm").value="";if(o)$("#pnm").focus()}
let _r=[];
