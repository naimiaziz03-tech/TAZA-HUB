<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحديث</title></head>
<body style="font-family:system-ui,Arial;text-align:center;padding:40px 16px"><h3>جارٍ مسح النسخة القديمة…</h3><p>بياناتك المحفوظة لن تُمسح.</p>
<script>(async()=>{try{const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()));const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}catch(e){}setTimeout(()=>location.replace("index.html?r="+Date.now()),600)})()</script></body></html>
