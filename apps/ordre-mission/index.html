<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أمر المهمة</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1565c0">
<meta name="color-scheme" content="light dark">
<meta name="application-name" content="أمر المهمة">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أمر المهمة">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef3f8;--card:#fff;--tx:#1b2430;--mu:#5a6878;--bd:#cfd9e4;--ac:#1565c0;--g:#2e7d32;--o:#ef6c00;--rd:#c0392b;--c1:#1565c0;--c2:#00897b;--c3:#b26a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a24;--card:#1c2733;--tx:#e8eef5;--mu:#9fb0c1;--bd:#34465a;--ac:#64b5f6;--g:#43a047;--o:#fb8c00;--rd:#ef7b6e;--c1:#64b5f6;--c2:#4db6ac;--c3:#ffca28}}
:root[data-theme="dark"]{--bg:#121a24;--card:#1c2733;--tx:#e8eef5;--mu:#9fb0c1;--bd:#34465a;--ac:#64b5f6;--g:#43a047;--o:#fb8c00;--rd:#ef7b6e;--c1:#64b5f6;--c2:#4db6ac;--c3:#ffca28}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Segoe UI",Tahoma,Arial,sans-serif}
main{width:100%;max-width:920px;min-height:100dvh;box-sizing:border-box;margin:0 auto;padding:clamp(10px,2.2vw,22px)}
.hd{background:linear-gradient(125deg,#1558b0 0%,#087f8c 58%,#00897b 100%);color:#fff;border-radius:18px;padding:clamp(14px,2.4vw,22px);margin-bottom:16px;box-shadow:0 8px 24px #0b52751c}
h1{font-size:20px;margin:0 0 4px}p.s{margin:0;font-size:13px;opacity:.92}
section{background:var(--card);border:1px solid var(--bd);border-inline-start:5px solid var(--c1);border-radius:15px;padding:clamp(13px,2vw,20px);margin-bottom:14px;box-shadow:0 3px 12px #152d4510}
section:nth-of-type(2){border-inline-start-color:var(--c2)}section:nth-of-type(2) h2,section:nth-of-type(2) summary{color:var(--c2)}
section:nth-of-type(3){border-inline-start-color:var(--c3)}section:nth-of-type(3) h2{color:var(--c3)}
h2{font-size:16px;margin:0 0 8px;color:var(--c1)}h3{font-size:14px;margin:0 0 4px;color:var(--c3)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input,textarea{width:100%;min-width:0;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);transition:border-color .15s,box-shadow .15s}
textarea{display:block;overflow:hidden;resize:none;min-height:0}
input:focus,textarea:focus{outline:2px solid var(--c1);border-color:transparent}
button{font:inherit;width:100%;min-height:46px;padding:11px 14px;border-radius:11px;border:1px solid var(--ac);background:var(--card);color:var(--ac);margin-top:8px;font-weight:650;cursor:pointer;transition:transform .12s,filter .12s}button:active{transform:scale(.99)}button:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 45%,transparent);outline-offset:2px}
#pvb{background:var(--o);border-color:var(--o);color:#fff}#go,#pdl{background:var(--g);border-color:var(--g);color:#fff}.hd{display:flex;gap:10px;align-items:flex-start}#nw{width:auto;margin:0;padding:8px 12px;font-size:14px;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.75);white-space:nowrap;flex:none}
details{margin-top:10px;border:1px dashed var(--c1);border-radius:8px;padding:2px 10px;background:color-mix(in srgb,var(--c1) 6%,transparent)}summary{cursor:pointer;padding:8px 0;color:var(--c1);font-size:14px}
.ag{display:grid;grid-template-columns:26px minmax(0,1fr) 78px 34px;gap:6px;align-items:start;padding:7px 0;border-bottom:1px dashed var(--bd)}
.ag .on{display:block;margin:10px 0 0;width:26px}.ag .on input{width:22px;height:22px;padding:0;accent-color:var(--g)}
.ag .addb{margin-top:10px;color:var(--c2);border-color:var(--c2)}.ag .del-agent{width:34px;min-width:34px;min-height:38px;margin:2px 0 0;padding:4px;border:1px solid var(--rd);border-radius:8px;color:var(--rd);background:transparent;font-size:20px;line-height:1;font-weight:800}.ag .del-agent[hidden]{display:none}@media(max-width:420px){.ag{grid-template-columns:25px minmax(0,1fr) 68px 32px}.ag .del-agent{width:32px;min-width:32px}}
.day{border:1px solid var(--bd);border-top:4px solid var(--c3);border-radius:10px;padding:8px 10px;margin-top:10px}
.tr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sug{border:1px solid var(--bd);border-radius:8px;background:var(--card);margin-top:4px;overflow:hidden}
.sug button{margin:0;border:0;border-bottom:1px solid var(--bd);border-radius:0;text-align:start;padding:10px;color:var(--tx);background:transparent}
#st{min-height:22px;font-size:13px;color:var(--mu);margin-top:10px;padding-inline:3px}#st.saved{color:var(--g)}#st.error{color:var(--rd)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{margin-top:0}#pvb{box-shadow:0 5px 14px #ef6c0028}#go,#pdl{box-shadow:0 5px 14px #2e7d3228}
@media(min-width:760px){#f{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}#f section:last-child{grid-column:1/-1}.hd h1{font-size:24px}}
@media(max-width:420px){.hd{gap:8px}.hd h1{font-size:18px}.hd p.s{font-size:12px}main{padding:10px}.tr{gap:7px}.ag{grid-template-columns:25px minmax(0,1fr) 78px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
#pv{position:fixed;inset:0;z-index:20;background:#8a8f96;overflow:auto;padding-top:env(safe-area-inset-top,0px);color-scheme:light;background-color:#8a8f96!important}
#pv[hidden]{display:none}
.bar{position:sticky;top:0;z-index:2;display:flex;gap:8px;padding:8px;background:var(--bg);border-bottom:1px solid var(--bd)}.bar button{margin:0}
#pc{padding:6px;background:#8a8f96!important;color:#111!important;color-scheme:light;min-height:calc(100vh - 70px);overflow-x:hidden}.docx-wrapper{background:#8a8f96!important;padding:8px!important;max-width:100%!important;box-sizing:border-box!important}.docx-wrapper .docx{background:#fff!important;color:#000!important;box-shadow:0 2px 12px #0003!important;max-width:none!important;box-sizing:border-box!important;overflow-wrap:anywhere}.docx-wrapper .docx table{max-width:100%!important;table-layout:fixed!important}.docx-wrapper .docx td,.docx-wrapper .docx th{overflow-wrap:anywhere;word-break:normal}.docx-wrapper .docx p,.docx-wrapper .docx span,.docx-wrapper .docx div,.docx-wrapper .docx td,.docx-wrapper .docx th{color:inherit}#pvstyles{color-scheme:light}
</style></head><body><main>
<div class="hd"><button id="nw">ملف جديد</button><div><h1>أمر المهمة وتقرير المهمة</h1><p class="s">القالب الأصلي محفوظ داخل التطبيق ولا يُعدَّل أبدا. كل معاينة أو تنزيل ينتج نسخة جديدة بالقيم التي تدخلها.</p></div></div>
<div id="f"></div>
<div class="actions"><button id="pvb">معاينة الوثيقة</button>
<button id="go">تنزيل Word</button></div>
<div id="st" role="status" aria-live="polite">✓ جاهز — تُحفظ التغييرات تلقائياً على هذا الجهاز</div>
</main>
<div id="pv" hidden><div class="bar"><button id="pdl">تنزيل</button><button id="pcl">إغلاق</button></div><div id="pc" dir="ltr"></div></div>

  r.innerHTML='<label class="on"><input type="checkbox"></label><textarea class="nm" rows="1" dir="auto" placeholder="الاسم"></textarea><input class="ml" inputmode="numeric" placeholder="Mle"><button type="button" class="del-agent" aria-label="حذف العون" title="حذف العون">×</button>';
  const nm=r.querySelector('.nm'),ml=r.querySelector('.ml'),cb=r.querySelector('input[type=checkbox]'),del=r.querySelector('.del-agent');
  nm.value=a.n;ml.value=a.m;cb.checked=!!a.on;
  const isBuiltIn= !a.custom;del.hidden=isBuiltIn;
  nm.oninput=()=>{nm.value=nm.value.replace(/\n/g,' ');a.n=nm.value;grow(nm);del.hidden=!a.custom;save()};nm.onkeydown=e=>{if(e.key=='Enter')e.preventDefault()};
  ml.oninput=()=>{ml.value=ml.value.replace(/\D/g,'');a.m=ml.value;save()};ml.onblur=()=>{sortAgents();renderAg()};cb.onchange=()=>{a.on=cb.checked;save()};
  del.onclick=()=>{if(builtInNames.has(String(a.n||'').trim().toUpperCase()))return;if(!confirm('واش متأكد بغيتي تحذف هاد العون؟'))return;ST.ag=ST.ag.filter(item=>item!==a);save();renderAg()};
  b.appendChild(r)});
 const ad=document.createElement('button');ad.type='button';ad.className='addb';ad.textContent='+ إضافة عون';ad.onclick=()=>{ST.ag.push({n:'',m:'',on:true,custom:true});save();renderAg();const fields=b.querySelectorAll('.nm');if(fields.length)fields[fields.length-1].focus()};b.appendChild(ad);growAll()}
function renderDays(){const b=$('days');b.innerHTML='';const L=rng(ST.d1,ST.d2);ST.days=ST.days||{};
 if(!L.length){b.textContent='حدّد تاريخ الانطلاق وتاريخ الرجوع في قسم الأمر بالمهمة.';return}
 L.forEach((iso,k)=>{const d=ST.days[iso]=ST.days[iso]||{de:'',a:'',t:''};const c=document.createElement('div');c.className='day';
  c.innerHTML='<h3></h3><div class="tr"><div><label>من</label><input class="de" dir="ltr" inputmode="numeric" maxlength="5" placeholder="00h00"></div><div><label>إلى</label><input class="a" dir="ltr" inputmode="numeric" maxlength="5" placeholder="00h00"></div></div><label>الأشغال المنجزة</label><textarea dir="auto" rows="3"></textarea>';
  c.querySelector('h3').textContent=`اليوم ${k+1} — ${fmt(iso)}`;
  const de=c.querySelector('.de'),a=c.querySelector('.a'),t=c.querySelector('textarea');de.dataset.dayDe=iso;a.dataset.dayA=iso;de.value=mask(d.de);a.value=mask(d.a);t.value=d.t||'';
  de.oninput=()=>{const g=de.value.replace(/\D/g,'').slice(0,4);de.value=mask(g);d.de=g;const dates=rng(ST.d1,ST.d2);if(dates[0]===iso){ST.h1=g;const f=document.querySelector('[data-field="h1"]');if(f)f.value=mask(g)}save()};a.oninput=()=>{const g=a.value.replace(/\D/g,'').slice(0,4);a.value=mask(g);d.a=g;const dates=rng(ST.d1,ST.d2);if(dates[dates.length-1]===iso){ST.h2=g;const f=document.querySelector('[data-field="h2"]');if(f)f.value=mask(g)}save()};t.oninput=()=>{d.t=t.value;grow(t);save()};b.appendChild(c);grow(t)});
 const first=ST.days[L[0]]||{},last=ST.days[L[L.length-1]]||{};
 ST.h1=first.de||'';const f1=document.querySelector('[data-field="h1"]');if(f1)f1.value=mask(ST.h1);
 ST.h2=last.a||'';const f2=document.querySelector('[data-field="h2"]');if(f2)f2.value=mask(ST.h2);
}
function render(){const box=$('f');box.innerHTML='';
 GROUPS.forEach(([t,items])=>{const s=document.createElement('section'),h=document.createElement('h2');h.textContent=t;s.appendChild(h);
  items.forEach(x=>{if(x=='AG'){const l=document.createElement('label');l.textContent='الأعوان';const d=document.createElement('div');d.id='ag';s.append(l,d)}
   else if(x=='DAYS'){const d=document.createElement('div');d.id='days';s.appendChild(d)}
   else if(x.row){const r=document.createElement('div');r.className='tr';x.row.forEach(f=>{const d=document.createElement('div');mk(f,d);r.appendChild(d)});s.appendChild(r)}
   else if(x.det){const d=document.createElement('details'),m=document.createElement('summary');m.textContent=x.det;d.appendChild(m);x.f.forEach(f=>mk(f,d));d.addEventListener('toggle',growAll);s.appendChild(d)}
   else mk(x,s)});box.appendChild(s)});renderAg();renderDays();growAll()}
async function init(){let z;try{z=await JSZip.loadAsync(B64,{base64:true});prep(await z.file('word/document.xml').async('string'))}catch(e){say('تعذر تحميل مكتبة الملفات. تحقق من الاتصال.');return}
 const sv=load();FIELDS.forEach(f=>ST[f.id]=sv[f.id]!==undefined?sv[f.id]:(f.hid?DEF[f.id]:''));
 ST.ag=Array.isArray(sv.ag)&&sv.ag.length?sv.ag:DEFAG.map(a=>({...a,on:false}));
 // Rename the built-in agent in saved data too, without creating a duplicate.
 ST.ag.forEach(a=>{if(String(a.n||'').trim().toUpperCase()==='BENSAID')a.n='BENSAID NOUR EL HAQ'});
 // Only agents explicitly added with the '+ إضافة عون' button get an X delete control.
 const builtInMatricules=new Set(['79246','76318','82697','82021','83677','83684']);
 const builtInNamesForDelete=new Set(['BENSAID','BENSAID NOUR EL HAQ','EL YAAGOUBI RACHID','JAGHMOUM JAOUAD','HAKKI OMAR','MORHLI MOUAD','NAIMI AZIZ']);
 ST.ag.forEach(a=>{const n=String(a.n||'').trim().toUpperCase(),m=String(a.m||'').replace(/\D/g,'');if(builtInMatricules.has(m)||builtInNamesForDelete.has(n))a.custom=false;else if(a.custom!==true)a.custom=true;});
 // MORHLI MOUAD is an ordinary agent: editable name/matricule and controlled by the same activation checkbox.
 // Migrate older saved data where this entry was incorrectly marked fixed and always active.
 ST.ag.forEach(a=>{if(String(a.n||'').trim().toUpperCase()==='MORHLI MOUAD'){
   if(a.fixed===true){a.fixed=false;a.on=false;}
   delete a.fixed;
 }});
 if(!ST.ag.some(a=>String(a.n||'').trim().toUpperCase()==='MORHLI MOUAD'))ST.ag.push({n:'MORHLI MOUAD',m:'83677',on:false});
 if(!ST.ag.some(a=>String(a.n||'').trim().toUpperCase()==='HAKKI OMAR'))ST.ag.push({n:'HAKKI OMAR',m:'82697',on:false});
 ST.ag.forEach(a=>{if(String(a.n||'').trim().toUpperCase()==='MORHLI MOUAD'&&!String(a.m||'').trim())a.m='83677';delete a.fixed});sortAgents();
 ST.days=sv.days||{};render()}
async function out(name,blob){let d=null,has=typeof claude!=='undefined';try{if(has)d=await claude.use('downloads')}catch(e){}
 if(has&&!d){say('التحميل غير متاح في هذا العرض. افتح التطبيق من claude.ai.');return}
 if(!d){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);say('تم تجهيز الملف.');return}
 try{await d.save({filename:name,data:blob});say('تم تجهيز الملف.')}catch(e){say(e&&e.code=='declined'?'تم إلغاء التحميل.':'تعذر الحفظ: '+((e&&e.code)||''))}}
async function dl(){if(!XML)return;try{const b=await make();await out(`OM_${(ST.d1||'mission').replace(/-/g,'')}.docx`,b)}catch(e){say('حدث خطأ أثناء التعبئة.')}}
$('go').onclick=dl;$('pdl').onclick=dl;$('pcl').onclick=()=>{$('pv').hidden=true;document.body.style.overflow=''};
$('pvb').onclick=async()=>{
 if(!XML){say('القالب الأصلي مازال ما تجهزش.');return}
 const modal=$('pv'),pc=$('pc');
 modal.hidden=false;
 document.body.style.overflow='hidden';
 pc.innerHTML='<div style="background:#fff;color:#263238;border-radius:10px;padding:18px;margin:8px;text-align:center;font:16px/1.7 system-ui">جار تجهيز معاينة الوثيقة…<br><small>خلي النافذة مفتوحة حتى تكمل المعالجة.</small></div>';
 say('جار تجهيز المعاينة...');
 try{
   if(!window.JSZip) throw new Error('تعذر تحميل مكتبة معالجة ملفات Word (JSZip). تحقق من الاتصال ثم أعد المحاولة.');
   const b=await make();
   if(!window.docx || typeof window.docx.renderAsync!=='function') throw new Error('مكتبة معاينة Word ما تحمّلاتش. تأكد من اتصال الإنترنت ثم أعد فتح المعاينة.');
   if(!pc || !pc.ownerDocument || !pc.ownerDocument.body) throw new Error('تعذر تجهيز مساحة المعاينة داخل الصفحة. أغلق النافذة وافتح التطبيق من جديد.');
   pc.innerHTML='';
   await window.docx.renderAsync(b,pc,pc,{className:'docx',inWrapper:true,breakPages:true,ignoreWidth:false,ignoreHeight:false});
   const w=pc.querySelector('.docx-wrapper');
   if(w){w.style.maxWidth='100%';w.style.width='100%';w.style.margin='0 auto';w.style.overflow='visible';w.style.padding='8px';w.style.boxSizing='border-box';}
   pc.style.background='#8a8f96';pc.style.colorScheme='light';
   const fitPages=()=>{const available=Math.max(240,pc.clientWidth-32);pc.querySelectorAll('.docx').forEach(page=>{page.style.maxWidth='none';page.style.boxSizing='border-box';page.style.margin='0 auto 12px';page.style.backgroundColor='#fff';page.style.color='#000';page.style.zoom='1';const natural=page.offsetWidth||page.scrollWidth;page.style.zoom=String(Math.min(1,available/natural));});};
   fitPages();window.setTimeout(fitPages,100);window.setTimeout(fitPages,350);
   say('✓ المعاينة جاهزة');
 }catch(e){
   pc.innerHTML='';
   const msg=document.createElement('div');
   msg.style.cssText='background:#fff;color:#8b1e1e;border-radius:10px;padding:16px;margin:8px;font:15px/1.8 system-ui;white-space:pre-wrap';
   msg.textContent='تعذر إظهار المعاينة، لكن النافذة بقات مفتوحة باش ما تختفيش مباشرة.\n\nالخطأ: '+(e&&e.message?e.message:String(e||'خطأ غير معروف'))+(e&&e.stack?'\n\nتفاصيل تقنية: '+e.stack.split('\n').slice(0,4).join('\n'):'')+'\n\nتقدر تسد النافذة وتجرب من جديد، أو تستعمل زر تنزيل Word.';
   pc.appendChild(msg);
   say('تعذرت المعاينة؛ راجع الرسالة داخل النافذة.');
 }
};
$('nw').onclick=()=>{const b=$('nw');if(b.dataset.c){delete b.dataset.c;b.textContent='ملف جديد';FIELDS.forEach(f=>{if(!f.hid)ST[f.id]=''});ST.ag.forEach(a=>{if(!a.fixed)a.on=false;else a.on=true});ST.days={};save();render();say('تم مسح المدخلات. الأعوان والحقول المخفية بقيت كما هي.')}
 else{b.dataset.c=1;b.textContent='تأكيد المسح؟';setTimeout(()=>{if(b.dataset.c){delete b.dataset.c;b.textContent='ملف جديد'}},4000)}};
window.addEventListener('resize',()=>{growAll();const pc=$('pc');if(!$('pv').hidden){pc.querySelectorAll('.docx').forEach(page=>page.style.zoom='1');const available=Math.max(240,pc.clientWidth-32);requestAnimationFrame(()=>pc.querySelectorAll('.docx').forEach(page=>{page.style.maxWidth='none';const scale=Math.min(1,available/(page.offsetWidth||page.scrollWidth));page.style.zoom=String(scale)}));}});
init();
